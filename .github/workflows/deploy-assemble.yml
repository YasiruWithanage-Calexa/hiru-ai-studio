name: Deploy assemble

# Builds infra/assemble (ffmpeg) and rolls it out to Cloud Run. Terraform owns the service's
# configuration (internal ingress, secrets); this workflow only changes which image runs.
on:
  push:
    branches: [main]
    paths:
      - "infra/assemble/**"
      - ".github/workflows/deploy-assemble.yml"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hiru/assemble:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" infra/assemble
          docker push "$IMAGE"

      - name: Deploy
        run: |
          gcloud run deploy "${{ vars.ASSEMBLE_SERVICE }}" \
            --image "$IMAGE" --region "${{ vars.GCP_REGION }}" --quiet
