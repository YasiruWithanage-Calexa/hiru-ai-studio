name: Deploy API

# Builds the API image and rolls it out to Cloud Run. Terraform owns the service's
# configuration (env, secrets, scaling); this workflow only changes which image runs.
on:
  push:
    branches: [main]
    paths:
      - "src/api/**"
      - "src/libs/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, prod]
        default: staging

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Repository "environments" hold the per-environment variables from `terraform output
    # github_variables`; prod has required reviewers.
    environment: ${{ inputs.environment || 'staging' }}
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/hiru/api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy
        run: |
          gcloud run deploy "${{ vars.API_SERVICE }}" \
            --image "$IMAGE" --region "${{ vars.GCP_REGION }}" --quiet

      - name: Health check
        run: |
          url=$(gcloud run services describe "${{ vars.API_SERVICE }}" \
                  --region "${{ vars.GCP_REGION }}" --format 'value(status.url)')
          curl --fail --retry 5 --retry-delay 3 "$url/healthz"
