folders:
  - src/libs/contracts/zora
  - src/services/zora_chat
  - tests/zora
  - tests/eval/zora
  - lab/zora
  - docs/zora
outside:
  - "hiru-ai-studio-interface: src/features/zora/ and its mount point on the Director page"
  - "Zora's row kernel is the shared step `coverage_kernel` (steps/coverage_kernel), reached by id: it stays when Zora goes"
