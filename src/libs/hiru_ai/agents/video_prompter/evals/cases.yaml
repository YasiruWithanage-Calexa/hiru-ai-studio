# gpt-6.1-sol's answer from lab run 003. A good answer: each line once, in order, `to` the addressee, a listener on
# an exchange, no speech verb in a silent clip (the step's gates check it: steps/video_prompt).
- name: 'E01-S04 4A-1: one line of two sentences: to Kasun, and how it turns inside the line'
  input:
    scene: '<scene>

      Scene: A CONVERSATION THAT CHANGES EVERYTHING. Returning the phone leads to a warm exchange about Kasun''s business.
      Her father''s call about marriage changes Anudi''s mood and ends the meeting.

      What it is for: Establish mutual interest and Kasun''s ambition while introducing the family pressure that interrupts
      their connection.

      Just before (the previous scene ends): Anudi hears him and turns around. Kasun approaches her, holding out the phone.

      Next (the following scene opens): A few weeks have passed. Kasun is serving customers as usual. Suddenly, a familiar
      voice interrupts him.

      Place: Colombo roadside. Mood of the scene: warm, curious, interrupted, reflective.

      People:

      - Anudi (on screen): wants to Thank Kasun and learn about him, then respond to her father''s demand; feels grateful
      and receptive at the start, subdued but open to meeting kasun again by the end.

      - Kasun (on screen): wants to Return her phone and answer her interest in his work; feels friendly and helpful at the
      start, distracted by the encounter and her change in mood by the end.

      - Father (heard on the phone only, never seen): wants to Have Anudi return home for a discussion about her marriage;
      feels urgent and directive at the start, expecting her return by the end.

      Between Kasun and Anudi: New acquaintances with mutual interest following smartphone''s return.

      The production''s direction: Visual Style: Realistic Sri Lankan cinematic drama, natural lighting, authentic environments
      and emotionally grounded performances. Scene Structure: Fewer, longer scenes with multiple camera shots and continuous
      dramatic action. Kasun maintains the same facial appearance, hairstyle and body type throughout. Anudi maintains the
      same facial appearance, hairstyle and body type throughout.

      Script, in order (a line''s id is the name you use for it; the words are Sinhala):

      action: Anudi takes her phone from Kasun. | how (the reader''s note): Keep the handover simple and clearly visible.
      | intent: Complete the return that initiates their conversation.

      L1 Anudi to Kasun: "අනේ, Thank you! මම දැක්කෙවත් නෑ." | how (the reader''s note): Genuine gratitude with mild surprise.
      | intent: Thank him and acknowledge that she missed the accident.

      L2 Kasun to Anudi: "වැස්ස නිසා වෙන්න ඇති." | how (the reader''s note): Gentle and matter-of-fact. | intent: Put her
      at ease by attributing the mishap to the weather.

      action: Anudi smiles and looks at his small food business. | how (the reader''s note): Let the smile lead into an interested
      look toward the stall. | intent: Shift her attention from the returned phone to Kasun''s livelihood.

      L4 Anudi to Kasun: "මේ ඔයාගේ බිස්නස් එකද?" | how (the reader''s note): Open curiosity without condescension. | intent:
      Find out whether the business belongs to him.

      L5 Kasun to Anudi: "ඔව්. පොඩියට පටන් ගත්තේ." | how (the reader''s note): Unembarrassed and modest. | intent: Confirm
      ownership while acknowledging the modest beginning.

      L6 Anudi to Kasun: "තනියමද මේ හැමදේම කරන්නේ?" | how (the reader''s note): Interest deepens rather than becoming an interrogation.
      | intent: Learn whether he manages all the work himself.

      L7 Kasun to Anudi: "ඔව්. රුපියල් පන්දහසකින් පටන් ගත්තේ. තව ඉස්සරහට යන්න තමයි බලාපොරොත්තුව." | how (the reader''s note):
      Honest pride, with hope stronger than self-promotion. | intent: Explain his independent start with five thousand rupees
      and his wish to grow.

      action: Anudi looks impressed. | how (the reader''s note): A restrained reaction rather than an emphatic display. |
      intent: Register her admiration before the interruption.

      action: Before she can continue the conversation, her phone suddenly rings. She checks the screen. It''s her father.
      | how (the reader''s note): The already established phone rings; give its caller display a readable moment. | intent:
      Interrupt the growing connection with family demands.

      L10 Anudi to Father: "හෙලෝ තාත්තේ." | how (the reader''s note): An ordinary greeting before she knows the reason for
      the call. | intent: Answer her father.

      L11 Father (through the phone) to Anudi: "අනුදි, ඔයා කොහෙද ඉන්නේ? ඉක්මනට ගෙදර එන්න. අපිට ඔයාගේ කසාදෙ ගැන කතා කරන්න තියෙනවා."
      | how (the reader''s note): Direct and authoritative without shouting. | intent: Locate Anudi and summon her home to
      discuss her marriage.

      action: Anudi''s smile slowly disappears. | how (the reader''s note): Let the warmth drain gradually from her expression.
      | intent: Show the emotional cost of the call.

      L13 Anudi to Father: "හරි තාත්තේ. මම එන්නම්." | how (the reader''s note): Subdued compliance, contrasting with her earlier
      ease. | intent: Agree to return.

      action: She ends the call. Kasun notices her changed expression. Anudi looks at him again. | how (the reader''s note):
      Allow a brief, observant pause without suggesting Kasun knows the unheard details. | intent: Return to their shared
      space with the interruption still affecting her.

      L15 Anudi to Kasun: "එහෙනම් මම යන්නම්. ආයෙත් හම්බවෙමු." | how (the reader''s note): Retain a little warmth beneath the
      changed mood. | intent: Take her leave while keeping open the possibility of another meeting.

      L16 Kasun to Anudi: "හරි. පරිස්සමින් යන්න." | how (the reader''s note): Simple, considerate warmth. | intent: Accept
      her departure and wish her well.

      action: Anudi walks toward her destination. Kasun watches her leave. After a moment, he returns to his small business,
      but his thoughts are somewhere else. | how (the reader''s note): Let Kasun linger before returning to work; avoid specifying
      the content of his thoughts. | intent: Leave the encounter resonating after Anudi departs.

      </scene>'
    clip: '<clip slate="4A-1">

      Role: two_shot; framing TWO (TWO, both from waist up with phone visible between them); angle eye level from road side;
      lens 40mm; camera move: locked_off (locked-off on sticks); take 6 s.

      Why the planner made it: Hold the return and her gratitude in a shared space without exaggerating the contact.

      Planner''s summary: From the road side, Kasun returns the phone to Anudi, who thanks him for noticing its loss (L1);
      rain continues around them.

      Setting: A rainy Colombo roadside beside Kasun''s small food three-wheeler, parked in right background.

      Light: Overcast daylight from the road side softly keys faces, falling off toward the shaded three-wheeler under continuous
      light rain.

      In frame: Kasun, consistent face, hairstyle and build, wearing a plain faded blue short-sleeved shirt and dark trousers.
      Position: Frame right facing left, standing, phone initially in right hand. Does: Offers the phone in his right hand
      and releases it into her right hand.

      In frame: Anudi, consistent face, hairstyle and build, wearing a plain cream blouse and muted teal skirt. Position:
      Frame left facing right, standing; open umbrella in left hand, handbag on left forearm, right hand initially empty.
      Does: Receives the phone in her right hand, then lips move to L1.

      Hands (a fact, keep it): Hands: Kasun is not holding the phone. Anudi holds the phone in one hand.

      Opens: on the accepted first frame

      Planner''s beats:

      - 0-3s: The offered phone bridges the gap between them. Both hold their established positions with the phone extended.
      Anudi fixes her eyes on the phone while Kasun keeps his arm steady. Kasun''s right hand gives the phone to Anudi''s
      right hand; the phone obscures their fingertips. Anudi closes her hand around the phone and lifts her gaze to him.

      - 3-6s: Gratitude opens their exchange. Anudi''s lips move to L1, phone held at her right waist. Anudi smiles toward
      him, eyebrows lifting slightly; Kasun meets her gaze. Both remain still in their new hand positions. Anudi holds the
      smile while Kasun lets his empty right hand settle.

      Planner''s sound: ambience Light rain, distant traffic.; effects Soft phone handling.; music None..

      Lines SPOKEN in this clip (each exactly once in your flow, in this order):

      - L1: Anudi, about 4.1 s of speech

      Speech in all: about 4.1 s of a 6 s take.

      Pictures attached for the video model: the opening frame; a face sheet and a look sheet for Kasun; a face sheet and
      a look sheet for Anudi. The frame already fixes the framing.

      </clip>'
