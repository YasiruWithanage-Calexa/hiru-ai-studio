      \ headlights, sodium lamps, practical bulbs and lightning flashes.\n- Editing - Fast cuts only on impact. Let important\
      \ punches and reactions stay on screen.\n- Sound - Rain, breathing, metal impacts and footsteps first. Music enters\
      \ only for hero elevation moments.\n- Slow motion - Use only twice: Nimal's key falling and Dinu removing the gun.\n\
      - The action is mass but not weightless. Every hit has a location, an object or a consequence.\n- Dinu is not an invincible\
      \ superhero; he wins because he knows vehicles, space and timing.\n- Aruni is an active participant in the climax,\
      \ and the final victory comes from the recording, the village and their courage - not from violence alone.\nScript,\
