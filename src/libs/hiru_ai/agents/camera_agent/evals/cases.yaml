  reply:
    camera_language: Handheld-motivated travel keeps the market crowded and physical; movement contracts around the tank,
      drives into the empty box at the turn, then rises away into isolation.
    arc: Watchfulness at 2 rises through pursuit at 4, compresses into rooftop suspense, drops to a quiet 2 before the empty-box
      peak at 5, then releases into loss.
