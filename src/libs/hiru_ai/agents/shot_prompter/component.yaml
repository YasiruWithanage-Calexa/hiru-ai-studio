id: shot_prompter
kind: agent
version: 1
summary: "Writes a shot's first frame and its video from ONE opening state (the still's composition, people, background and light; the video's situation, people, flow by line id and sound); the shot_prompt step keeps every fact, checks both and assembles them."
status: active
owner: shot_prompts
model: shot_prompter
shape: structured
phase: shot_prompter.write
input: schema:Input
output: schema:ShotPrompts
prompts: { system: prompts/system.md }
tools: []
knowledge: []
middleware: [static_first, usage, untrusted_text, absent_safe]
writes_dialogue: false
