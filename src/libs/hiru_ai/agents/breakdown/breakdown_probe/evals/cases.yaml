# breakdown_probe (plan/2026-11-15). Scripted replies test the seams; lab/llm_reader ran the live reads (run3-run5).
- name: a clean Sinhala script
  input:
    message: "<document filename=\"a.pdf\" lines=\"3\">\nL0001 | SCENE 01 — KASUN'S EVERYDAY LIFE\nL0002 | Kasun smiles.\nL0003 | Kasun: \"මගේම රෙස්ටුරන්ට් එකක්.\"\n</document>"
