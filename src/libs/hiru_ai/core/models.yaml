# Model tiers (plan/2026-11-03 §5.9, ADR 0003). A tier says WHICH settings it reads (`model`, `effort` are field
# names of OpenAISettings, so ids stay in the environment) and how a call behaves. Agents name a tier, never a model.
#
# The tier names are the ones the engines use today (their parity fixtures record them), not the plan's
# fast/smart. `fallbacks` is empty everywhere to keep today's behaviour; a tier listed there is tried, in order,
# after this one fails.
tiers:
  ultra:  { model: model_ultra,  effort: effort_ultra,  timeout_s: 180, retries: 2, fallbacks: [] }
  high:   { model: model_high,   effort: effort_high,   timeout_s: 180, retries: 2, fallbacks: [] }
  medium: { model: model_medium, effort: effort_medium, timeout_s: 120, retries: 2, fallbacks: [] }
  low:    { model: model_low,    effort: effort_low,    timeout_s: 60,  retries: 2, fallbacks: [] }
  # The big model at low effort: the top rung of Shot Planner Adam's fixer ladder (plan/2026-11-05 T3). One problem, a
  # short answer; it thinks little and costs a fraction of a `high` call.
  fixer:  { model: model_high,   effort: effort_fixer,  timeout_s: 300, retries: 1, fallbacks: [] }
  # Shot Planner David (plan/2026-11-05e §4.2): one strong model for the author and the repairer, picked by the spike (D3).
  # The author writes a whole scene's shots with their camera design in one answer, so it gets a long timeout.
  author: { model: model_author, effort: effort_author, timeout_s: 600, retries: 1, fallbacks: [] }
  repair: { model: model_author, effort: effort_repair, timeout_s: 300, retries: 1, fallbacks: [] }
  # Shot Planner Jonathan (plan/2026-11-06b): its author and its reviser, its own model at the effort the lab proved. A whole
  # scene's treatment and shots in one answer, and a corrected plan in the next, so a long timeout.
  jonathan: { model: model_jonathan, effort: effort_jonathan, timeout_s: 900,  retries: 1, fallbacks: [] }
  vision: { model: model_vision,                        timeout_s: 120, retries: 1, fallbacks: [] }  # the frame check
embed:
  model: embedding_model
  dimensions: embedding_dimensions
  timeout_s: 60
  retries: 2
image:
  model: model_image
  quality: image_quality
