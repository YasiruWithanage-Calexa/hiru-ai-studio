# Model tiers (plan/2026-11-03 §5.9, ADR 0003). A tier says WHICH settings it reads (`model`, `effort` are field
# names of OpenAISettings, so ids stay in the environment) and how a call behaves. Agents name a tier, never a model.
#
# The tier names are the ones the engines use today (their parity fixtures record them), not the plan's
# fast/smart. `fallbacks` is empty everywhere to keep today's behaviour; a tier listed there is tried, in order,
# after this one fails.
tiers:
  ultra:  { model: model_ultra,  effort: effort_ultra,  timeout_s: 180, retries: 2, fallbacks: [] }
  high:   { model: model_high,   effort: effort_high,   timeout_s: 180, retries: 2, fallbacks: [] }
  medium: { model: model_medium, effort: effort_medium, timeout_s: 120, retries: 2, fallbacks: [] }
  low:    { model: model_low,    effort: effort_low,    timeout_s: 60,  retries: 2, fallbacks: [] }
  # The big model at low effort: the top rung of Shot Planner Adam's fixer ladder (plan/2026-11-05 T3). One problem, a
  # short answer; it thinks little and costs a fraction of a `high` call.
  fixer:  { model: model_high,   effort: effort_fixer,  timeout_s: 300, retries: 1, fallbacks: [] }
  # Shot Planner David (plan/2026-11-05e §4.2): one strong model for the author and the repairer, picked by the spike (D3).
  # The author writes a whole scene's shots with their camera design in one answer, so it gets a long timeout.
  author: { model: model_author, effort: effort_author, timeout_s: 600, retries: 1, fallbacks: [] }
  repair: { model: model_author, effort: effort_repair, timeout_s: 300, retries: 1, fallbacks: [] }
  # Shot Planner Jonathan (plan/2026-11-06b): its author and its reviser, its own model at the effort the lab proved. A whole
  # scene's treatment and shots in one answer, and a corrected plan in the next, so a long timeout.
  jonathan: { model: model_jonathan, effort: effort_jonathan, timeout_s: 900,  retries: 1, fallbacks: [] }
  # Shot Planner Raphael (plan/2026-11-08e): one tool-calling conversation per stage on its own model at the effort the lab used
  # (the model and effort are fixed in raphael_models.yaml). Each turn writes whole clips with their camera design, so a long timeout.
  raphael:                  { timeout_s: 900, retries: 1, fallbacks: [], responses: true }
  # plan/2026-11-08f §5: Raphael's later turns (repairs) and its cinematic pass, each tunable alone. `responses: true`
  # sends a conversation through OpenAI's Responses API with `previous_response_id`, so the model's reasoning carries
  # from one turn to the next as it did in the lab (Chat Completions drops it, and every turn re-reasons from zero).
  raphael_repair:           { timeout_s: 900, retries: 1, fallbacks: [], responses: true }
  # plan/2026-11-10: the director's breakdown, ONE request before stage 1. Stage 1's first-turn model and effort until the person picks another (D3).
  raphael_breakdown:        { timeout_s: 900, retries: 1, fallbacks: [] }
  raphael_cinematic:        { timeout_s: 900, retries: 1, fallbacks: [], responses: true }
  raphael_cinematic_repair: { timeout_s: 900, retries: 1, fallbacks: [], responses: true }
  # Zora, the director chat (plan/2026-11-06e D7): its one author per turn is Jonathan's model at a lower effort (the
  # lab's arm A), so the chat's craft is the planner's. Edits are small, so a shorter timeout than a whole plan's.
  zora:     { model: model_jonathan, effort: effort_zora,     timeout_s: 600,  retries: 1, fallbacks: [] }
  # The document reader (plan/2026-11-06f Q1): the author's model reads a whole episode, or its page images, in one
  # answer; its repairer is the same model on the same tier.
  reader:   { model: model_author,   effort: effort_reader,   timeout_s: 900,  retries: 1, fallbacks: [] }
  # The scene breakdown (plan/2026-11-11 §9): the split, continuity, the episode calls, their repair and the stager on
  # blocks, all one model at one effort as in the lab (GPT-6.1 Sol, medium). A six-scene episode call is a long answer.
  breakdown: { model: model_breakdown, effort: effort_breakdown, timeout_s: 900, retries: 1, fallbacks: [] }
  # Sable, the production assistant chat (plan/2026-11-08 §4.4): a turn starts on `sable` (the average model) and moves
  # once, upward, to `sable_deep` when the work needs it (core/middleware/tiering.py). The lab (Phase 4) picks the pair.
  sable:      { model: model_sable,      effort: effort_sable,      timeout_s: 120, retries: 2, fallbacks: [] }
  sable_deep: { model: model_sable_deep, effort: effort_sable_deep, timeout_s: 300, retries: 1, fallbacks: [] }
  vision: { model: model_vision,                        timeout_s: 120, retries: 1, fallbacks: [] }  # the frame check
embed:
  model: embedding_model
  dimensions: embedding_dimensions
  timeout_s: 60
  retries: 2
image:
  model: model_image
  quality: image_quality
  draft_quality: image_quality_draft
