id: adam_film_grammar
kind: knowledge_base
version: 1
summary: "Drama grammar for Shot Planner Adam: 16 principles, a library of 40 devices, Hiru house drama notes (draft) and Veo feasibility notes."
status: active
owner: director
# `chunks.corpus` only allows craft, production_docs, canon and memory (a database check), and a corpus without a
# production must be `craft`. Adam's rows are kept apart by their source prefix, not their corpus: a re-ingest replaces
# exactly the rows under knowledge_base/adam_film_grammar/, and no other base writes there. The Phase 6 migration may
# add an `adam` corpus; then this one line changes and the base is re-ingested (plan/2026-11-04b IMPLEMENTED.md).
corpus: craft
store: chunks
ingest: files
sources: sources
source_prefix: knowledge_base/adam_film_grammar/   # chunks.source starts with this; rows under it are replaced as a set
chunking: { script_like: false }    # Markdown headings: one device or principle per chunk
embed: embed
# No `uses:`: the shared KnowledgeBase base (hiru_ai.rag.knowledge) reaches the text extractor and the chunker by id, and a
# part of the adam group names only parts of the group (plan/2026-11-04b §5.0 rule 3).
