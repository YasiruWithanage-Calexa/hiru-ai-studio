  - { path: dialogue.md, meta: { specialty: dialogue } }
  - { path: directing.md, meta: { specialty: directing } }
  - { path: editing.md, meta: { specialty: editing } }
  - { path: producing.md, meta: { specialty: producing } }
  - { path: sound.md, meta: { specialty: sound } }
  - { path: hiru-house-style.md, meta: { specialty: house-style } }
