[[tool.importlinter.contracts]]
name = "jonathan panels never import each other"
type = "independence"
modules = ["hiru_ai.panels.jonathan.*"]

[[tool.importlinter.contracts]]
name = "jonathan tools never import each other"
type = "independence"
modules = ["hiru_ai.tools.jonathan.*"]

[[tool.importlinter.contracts]]
name = "jonathan systems never import each other"
type = "independence"
modules = ["hiru_ai.systems.jonathan.*"]

[[tool.importlinter.contracts]]
name = "jonathan knowledge bases never import each other"
type = "independence"
modules = ["hiru_ai.knowledge_bases.jonathan.*"]


# plan/2026-11-08e §7: Raphael's parts live in a `raphael` folder inside each layer, kept apart the same way.

[[tool.importlinter.contracts]]
name = "raphael agents never import each other"
