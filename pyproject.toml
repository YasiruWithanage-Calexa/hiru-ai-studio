# plan/2026-11-06e §4.0: Zora's parts live in a `zora` folder inside each layer, kept apart the same way. The steps reach
# each other (and the planner's checks) by id through `core.parts`, never by import.

[[tool.importlinter.contracts]]
name = "zora steps never import each other"
type = "independence"
modules = ["hiru_ai.steps.zora.zora_kernel", "hiru_ai.steps.zora.zora_deps", "hiru_ai.steps.zora.zora_board",
           "hiru_ai.steps.zora.zora_deliver", "hiru_ai.steps.zora.zora_ledger", "hiru_ai.steps.zora.zora_guard",
           "hiru_ai.steps.zora.zora_save"]

[[tool.importlinter.contracts]]
name = "zora agents never import each other"
type = "independence"
modules = ["hiru_ai.agents.zora.*"]

[[tool.importlinter.contracts]]
name = "zora systems never import each other"
type = "independence"
modules = ["hiru_ai.systems.zora.*"]

# Sable, the production assistant chat (plan/2026-11-08 §4.2): the `sable` group, kept apart the same way.
[[tool.importlinter.contracts]]
name = "sable agents never import each other"
type = "independence"
modules = ["hiru_ai.agents.sable.*"]

[[tool.importlinter.contracts]]
name = "sable tools never import each other"
type = "independence"
modules = ["hiru_ai.tools.sable.*"]

[[tool.importlinter.contracts]]
name = "sable systems never import zora (plan/2026-11-08 rule 10)"
type = "forbidden"
source_modules = ["hiru_ai.agents.sable", "hiru_ai.steps.sable", "hiru_ai.tools.sable", "hiru_ai.systems.sable",
                  "contracts.sable", "sable_chat"]
forbidden_modules = ["hiru_ai.agents.zora", "hiru_ai.steps.zora", "hiru_ai.systems.zora", "contracts.zora",
                     "zora_chat"]

# The document reader (plan/2026-11-06f): the `reader` group.
[[tool.importlinter.contracts]]
name = "reader agents never import each other"
