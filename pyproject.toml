[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hiru-ai-studio"
version = "0.1.0"
description = "Hiru AI Studio backend: FastAPI API, shared contracts and Cloud Run functions."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.4",
    "starlette==1.7.0",
    "uvicorn[standard]==0.54.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator==2.2.0",
    "supabase>=2.10,<3",
    "httpx>=0.27,<1",
    "PyJWT[crypto]>=2.10,<3",
    "cryptography>=43",
    "google-cloud-tasks==2.16.3",
    "python-multipart==0.0.32",
    "openai>=1.60,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "functions-framework==3.10.2",
    "pypdf==6.19.0",
]

[tool.setuptools.packages.find]
# "src" holds `api`; "src/libs" exposes the shared `contracts` package at top level.
# Services under src/services/* are NOT installed: each runs from its own folder
# (functions-framework --source locally, the zip root in production) and bundles `contracts`.
where = ["src", "src/libs"]
include = ["api*", "contracts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "src/libs"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "src/libs", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
    "S101",  # assert
    "RUF001", "RUF002", "RUF003",  # ×, – and → are used on purpose in docs and comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src", "src/libs"]
packages = ["api", "contracts"]
ignore_missing_imports = true
warn_unused_ignores = true
