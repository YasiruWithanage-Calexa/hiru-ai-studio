# The corrected reading of Episode 1 (plan/2026-11-06 §4.1): what a perfect Story Reader would give, written by hand from
# input/story.txt, so that David's own quality is measured alone (finding F10 fixed by hand).
#
#   - ONE scene: the rain and the road are in it (the database's reading cut the rain into its own 4 s scene).
#   - Kasun's thought is a VOICE-OVER line (the story says "he told himself": it is spoken aloud, heard not seen).
#   - The narrator's last line is kept, as a narrator voice-over.
#   - The father's line is "on the phone": he is only heard, never in frame.
#   - The descriptive sentences stay as blocks: they are direction for performance and look, not separate pictures.
#   - Block numbers are this file's own; a dialogue block's line is L<block number> (the line at b7 is L7).
#
# The words of the lines are the story's own. Nothing here is invented: the people's looks and essence come from the
# cast bible in tests/fixtures/prose/three-episode-drama.txt and from the plan's §4.1.
id: episode1
title: The First Meeting
heading: EXT. COLOMBO ROADSIDE – DAY (heavy rain)
episode_title: The First Meeting
synopsis: >-
  Kasun, a young street-food vendor, sells tea and short eats beside his three-wheeler in the rain. Anudi, from a
  comfortable family, drops her phone near his stall; he returns it, they talk, and her father's call cuts the moment
  short. A first meeting that will change his life.
style: >-
  Cinematic Sri Lankan romantic drama for television. Realistic, monsoon Colombo, rich but natural colour.
time:
  guide_s: 60
  policy: >-
    The length is the producer's budget (about 60 s): land within about 20% of it in `use_s`. An overrun is reported,
    never trimmed. A take may be longer than the edit keeps: `use_s` is the seconds the editor keeps (2 to the take).
people:
  - name: Kasun
    code: C01
    look: Simple plain T-shirt, dark jeans, sandals; slim, medium brown skin, short black hair, light stubble; wet from the rain.
    essence: A young street-food vendor, proud and hungry to grow, shy with strangers. His clothes are simple; his eyes are full of ambition.
  - name: Anudi
    code: C02
    look: Elegant blouse and trousers, simple jewellery, a stylish handbag; long dark hair, elegant natural makeup.
    essence: From a comfortable family; warm and curious, kind, under her father's control.
  - name: Father
    code: C03
    look: Polo shirt and formal trousers (heard only; never seen in this scene).
    essence: "Anudi's father, protective and practical. In this scene he is only a voice on the phone."
story_objects: [phone, tea, umbrella]
scene:
  cast: [Kasun, Anudi, Father]
  others: []
  place:
    name: A Colombo roadside in heavy rain
    objects:
      - road
      - traffic
      - tuk-tuks
      - three-wheeler
      - counter
      - tea flask
      - tea
      - glasses
      - short eats
      - food containers
      - handwritten menu
      - cash box
      - family car
      - umbrella
      - foldable umbrella
      - phone
      - puddles
      - shop fronts
  blocks:
    - { index: 0, kind: action, text: "It is raining heavily in Colombo." }
    - { index: 1, kind: action, text: "Kasun stands beside his small three-wheeler, selling homemade short eats and tea to office workers." }
    - { index: 2, kind: action, text: "His clothes are simple, but his eyes are full of ambition." }
    - { index: 3, kind: dialogue, speaker: Kasun, line_id: L3, delivery: "voice over, to himself", text: "One day… I'll have my own restaurant." }
    - { index: 4, kind: action, text: "Across the road, Anudi steps out of a comfortable family car, dressed elegantly and holding an umbrella." }
    - { index: 5, kind: action, text: "She accidentally drops her phone near Kasun's three-wheeler." }
    - { index: 6, kind: action, text: "Kasun picks it up and runs after her." }
    - { index: 7, kind: dialogue, speaker: Kasun, line_id: L7, text: "Miss! Your phone!" }
    - { index: 8, kind: action, text: "Anudi turns around." }
    - { index: 9, kind: dialogue, speaker: Anudi, line_id: L9, text: "Oh… thank you." }
    - { index: 10, kind: action, text: "She looks at his little business." }
    - { index: 11, kind: dialogue, speaker: Anudi, line_id: L11, text: "You made all this yourself?" }
    - { index: 12, kind: action, text: "Kasun smiles." }
    - { index: 13, kind: dialogue, speaker: Kasun, line_id: L13, text: "Started with Rs. 5,000. I'm trying to make it bigger." }
    - { index: 14, kind: action, text: "Anudi smiles back." }
    - { index: 15, kind: action, text: "Suddenly, her phone rings. It is her father." }
    - { index: 16, kind: dialogue, speaker: Father, line_id: L16, delivery: on the phone, text: "Anudi, where are you? Come home. We need to talk about your marriage." }
    - { index: 17, kind: action, text: "Her smile disappears." }
    - { index: 18, kind: action, text: "She looks at Kasun one more time." }
    - { index: 19, kind: dialogue, speaker: Anudi, line_id: L19, text: "Maybe… I'll see you again." }
    - { index: 20, kind: action, text: "She walks away." }
    - { index: 21, kind: action, text: "Kasun watches her leave." }
    - { index: 22, kind: dialogue, speaker: Narrator, line_id: L22, delivery: narrator voice over, text: "He had no idea that this meeting was about to change his life." }
