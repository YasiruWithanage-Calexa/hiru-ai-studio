const POSE = {  // pelvis height, thigh pitch, knee bend, torso pitch (radians; + leans forward)

  crouching: [0.45, -1.9, 2.3, 0.45], leaning: [0.92, 0, 0, 0.5], rising: [0.7, -0.9, 0.95, 0.35], lying: [0.92, 0, 0, 0]};
function mannequin(p) {
