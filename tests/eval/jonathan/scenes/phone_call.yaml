id: phone_call
title: An Unexpected Phone Call
covers: a call that breaks a mood
status: draft
scene:
  cast: [Anudi, Dasun]
  place:
    name: A bench by the lake, late afternoon
    objects: [bench, lake, phone, bag, trees, water]
  blocks:
    - { index: 0, kind: action, text: "A bench by the lake, late afternoon. ANUDI laughs, her phone face-down on the bench between her and DASUN." }
    - { index: 1, kind: dialogue, speaker: Dasun, line_id: L1, text: "ඉතින් මම කිව්වා, ඕක බොරු!" }
    - { index: 2, kind: action, text: "Her phone buzzes on the bench. The screen lights: THATHTHA." }
    - { index: 3, kind: action, text: "Anudi glances at it, still smiling, and answers." }
    - { index: 4, kind: dialogue, speaker: Father (on the phone), line_id: L4, text: "දුවේ, ඔයාගේ විවාහය ගැන අපි තීරණය කළා." }
    - { index: 5, kind: action, text: "Her smile begins to fade." }
    - { index: 6, kind: dialogue, speaker: Anudi, line_id: L6, delivery: quietly, text: "මම එන්නම්, තාත්තේ." }
    - { index: 7, kind: action, text: "She ends the call and puts the phone face-down on the bench." }
    - { index: 8, kind: dialogue, speaker: Anudi, line_id: L8, delivery: restrained, text: "ආයෙ හම්බවෙමු." }
    - { index: 9, kind: action, text: "She picks up her bag and walks out. Dasun watches her go." }
