# MASTER (draft) for father_refuses. Written by Claude for the person and a Hiru director to correct (plan §12 D6).
scene: father_refuses
status: draft
author: claude (draft for the person and a Hiru director)
director_note: >
  The father never raises his voice; the argument is in what he looks at. So the camera looks where he looks (the
  cups, the kettle, the worn stool) and lets us feel the size of the judgement, and it stays with Kasun, whose pride
  is the thing at stake. His pause with the kettle is the one break in rhythm: he is deciding not to be small. The
  last image is Kasun, still standing at his stall, with the road empty where the car was.
plan:
  analysis:
    about: A father measures a man by his stall, and the man refuses to be measured.
    dramatic_question: Will Kasun let the judgement stand?
    value: { start: hope, end: resolve }
    tone: quiet, held
    beats:
      - { blocks: [0, 1], action: "the father arrives and asks the question", reaction: "Kasun feels measured" }
      - { blocks: [2, 3], action: "Kasun answers; the father looks over the stall", reaction: "the stall looks small" }
      - { blocks: [4, 5], action: "the father says what he thinks", reaction: "Kasun puts the kettle down and holds", turn: true, reactor: Kasun }
      - { blocks: [6, 7], action: "Kasun answers; the father leaves", reaction: "he stays standing" }
    wants: { Kasun: "to be seen as worthy", Father: "to protect his daughter" }
    obstacles: ["the stall is small", "pride on both sides"]
    pov_owner: { start: Kasun, end: Kasun, why: "the judgement lands on him" }
    audience_knows: []
    baseline: { blocks: [], state: "the scene opens mid-evening, already at work" }
    break: { block: 4 }
    aftermath: { state: "alone, unbowed" }
    key_moment: { block: 5, why: "the kettle goes down and he does not answer at once" }
  treatment:
    name: "held, then straight"
    concept: "we make the viewer feel the weight of being measured, then the quiet of standing up"
    pov: "Kasun's"
    sound_concept: "traffic and steam, thinning to the clink of the kettle, then the car pulling away"
    sections:
      - { beats: [0], camera_behaviour: "wide, still", size_band: [WS, MS], sound_state: "busy road" }
      - { beats: [1], camera_behaviour: "the camera follows the father's eyes", size_band: [MCU, INSERT], sound_state: "busy road" }
      - { beats: [2], camera_behaviour: "close, still", size_band: [MS, CU], sound_state: "thin" }
      - { beats: [3], camera_behaviour: "steady, then wide", size_band: [MCU, WS], sound_state: "car pulling away" }
    size_arc: [WS, MCU, CU, WS]
    motif: "the kettle"
    plant: { object: kettle, plant_moment: m2, payoff_moment: m8 }
    rhythm: ["steady", "watching", "held", "settling"]
    rhythm_break: { moment: m7, kind: long_hold }
    entry: "as he pours"
    exit: "the car leaves"
    ending_image: "Kasun at his stall, the road empty"
    ending_moment: m11
    off_speaker: false
