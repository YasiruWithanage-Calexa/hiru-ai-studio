    - { number: 4, moments: [m5], title: "What he sees", size: INSERT, arrangement: single, angle: high, lens_feel: normal, movement: pan, focus: { kind: shallow }, beats: [{ window: [0, 4], action: "the cups, the kettle, the worn stool", camera: "a slow pan with his gaze" }], cut_in: { link: cut, motive: look }, purpose: "The stall looks small", emotional_beat: "smallness", take_s: 4 }
