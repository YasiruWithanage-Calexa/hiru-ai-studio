# MASTER (draft) for refuses_money. Written by Claude for the person and a Hiru director to correct (plan §12 D6).
scene: refuses_money
status: draft
author: claude (draft for the person and a Hiru director)
director_note: >
  The envelope is the scene: it crosses the desk, it is looked at, it goes back. The father's offer plays over Kasun's
  face, because the temptation is what we must watch him resist. His long look at the envelope, with nothing said, is
  the one break in rhythm. He answers, steady and small; and the last image is the envelope itself, untouched, with
  the father who has run out of words.
