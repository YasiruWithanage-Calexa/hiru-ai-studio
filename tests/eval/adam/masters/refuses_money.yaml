    about: "A man refuses a price for his love."
    dramatic_question: "Will he take the money?"
    value: { start: temptation, end: dignity }
    tone: "still, tense"
    beats:
      - { blocks: [0, 1], action: "the offer is made", reaction: "Kasun hears the price" }
      - { blocks: [2], action: "he looks and does not touch", reaction: "he decides" }
      - { blocks: [3, 4], action: "he refuses and returns the envelope", reaction: "his dignity holds", turn: true, reactor: Kasun }
      - { blocks: [5], action: "the father has no answer", reaction: "his certainty breaks" }
    wants: { Kasun: "to keep his dignity", Father: "to end the match" }
    obstacles: ["the money", "the father's authority"]
    pov_owner: { start: Kasun, end: Kasun, why: "the choice is his" }
    audience_knows: []
    baseline: { blocks: [], state: "" }
